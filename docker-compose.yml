version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: cloudguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-cloudguard}
      POSTGRES_USER:     ${DB_USER:-cloudguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cloudguard_secret}
    volumes:
      - cloudguard_pgdata:/var/lib/postgresql/data   # Named volume = persistent data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cloudguard} -d ${DB_NAME:-cloudguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudguard-net

  # ── Node.js Backend API ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudguard-backend
    restart: unless-stopped
    environment:
      PORT:        3000
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME:-cloudguard}
      DB_USER:     ${DB_USER:-cloudguard}
      DB_PASSWORD: ${DB_PASSWORD:-cloudguard_secret}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudguard-net

  # ── Nginx Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudguard-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - cloudguard-net

# ── Named Volume (data survives container restarts) ──────────
volumes:
  cloudguard_pgdata:
    driver: local

# ── Internal Network ─────────────────────────────────────────
networks:
  cloudguard-net:
    driver: bridge
